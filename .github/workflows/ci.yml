name: CI

on:
    pull_request:
    push:
        branches:
            - main

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7.0.1

            - uses: dtolnay/rust-toolchain@stable

            - uses: actions/cache@v6.1.0
              with:
                  key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
                  path: |
                      ~/.cargo/git
                      ~/.cargo/registry
                      target

            - run: cargo test
